<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%223.5%22 width=%2212%22 height=%229%22 rx=%224.5%22 fill=%22none%22 stroke=%22%232e3238%22 stroke-width=%223%22/%3E%3Crect x=%222%22 y=%223.5%22 width=%2212%22 height=%229%22 rx=%224.5%22 fill=%22none%22 stroke=%22%23ffd23f%22 stroke-width=%220.8%22 stroke-dasharray=%221.5 1.5%22/%3E%3Crect x=%2210%22 y=%2210.5%22 width=%224%22 height=%223%22 rx=%221%22 fill=%22%23e8443a%22/%3E%3C/svg%3E" />
    <title>Tiny Laps — track editor</title>
    <!-- Shown until the game's code and styles have loaded; the page hides it when ready. -->
    <style>
      html { background: #0b0f14; }
      html:not(.gg-ready) body > :not(#splash) { visibility: hidden; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(circle at 50% 42%, #1b2a20, #0b0f14 70%);
        color: #f4f6f2;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.35s ease;
      }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash svg { width: min(220px, 50vw); height: auto; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.35)); }
      #splash .word {
        margin: 0;
        font-size: clamp(34px, 7vw, 56px);
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      #splash .word em { margin-left: 0.18em; color: #ffd23f; }
      #splash .bar { width: min(240px, 60vw); height: 6px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.1); }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffe066, #ffb321); animation: gg-load 1.1s ease-in-out infinite; }
      #splash small { color: rgba(255, 255, 255, 0.5); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
      @keyframes gg-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body class="editor">
    <div id="splash" role="status" aria-label="Loading Tiny Laps">
      <svg viewBox="0 0 64 44" aria-hidden="true">
        <rect x="4" y="4" width="56" height="36" rx="18" fill="none" stroke="#2e3238" stroke-width="10" />
        <rect x="4" y="4" width="56" height="36" rx="18" fill="none" stroke="#ffd23f" stroke-width="1.2" stroke-dasharray="3.5 3.5" />
        <g transform="translate(30 0)"><rect width="3" height="3" fill="#fff" /><rect x="3" y="3" width="3" height="3" fill="#fff" /><rect y="6" width="3" height="3" fill="#fff" /><rect x="3" width="3" height="3" fill="#111" /><rect y="3" width="3" height="3" fill="#111" /><rect x="3" y="6" width="3" height="3" fill="#111" /></g>
        <g>
          <rect x="-4.5" y="-2.6" width="9" height="5.2" rx="1.6" fill="#e8443a" />
          <rect x="0.6" y="-1.8" width="2.2" height="3.6" rx="0.6" fill="#1d2430" />
          <animateMotion dur="1.6s" repeatCount="indefinite" rotate="auto" path="M22 4 H42 A18 18 0 0 1 42 40 H22 A18 18 0 0 1 22 4 Z" />
        </g>
      </svg>
      <p class="word">Tiny<em>Laps</em></p>
      <div class="bar"><i></i></div>
      <small>Warming up the tyres…</small>
    </div>
    <aside id="panel">
      <h1>Track editor</h1>
      <label class="row">
        <span>My tracks</span>
        <select id="track-list"></select>
      </label>
      <div class="buttons">
        <button type="button" id="new">New</button>
        <button type="button" id="undo" title="Ctrl+Z">Undo</button>
        <button type="button" id="delete" class="danger">Delete</button>
      </div>

      <label class="row">
        <span>Name</span>
        <input id="name" maxlength="24" />
      </label>
      <label class="row">
        <span>Road width <b id="width-val"></b></span>
        <input id="width" type="range" min="50" max="95" step="1" />
      </label>
      <label class="row">
        <span>Map size</span>
        <select id="size">
          <option value="small">Small (1200 × 800)</option>
          <option value="medium">Medium (1600 × 1050)</option>
          <option value="large">Large (2200 × 1450)</option>
        </select>
      </label>
      <label class="row">
        <span>Ground</span>
        <select id="ground">
          <option value="grass">Grass</option>
          <option value="snow">Snow</option>
          <option value="sand">Sand</option>
          <option value="gravel">Gravel</option>
          <option value="dirt">Dirt</option>
          <option value="asphalt">Paving</option>
        </select>
      </label>
      <label class="row">
        <span>Road</span>
        <select id="road">
          <option value="asphalt">Asphalt</option>
          <option value="dirt">Dirt (rally stage)</option>
        </select>
      </label>
      <label class="row">
        <span>Theme</span>
        <select id="theme">
          <option value="">Automatic</option>
          <option value="meadow">Meadow</option>
          <option value="winter">Winter</option>
          <option value="jungle">Jungle</option>
          <option value="desert">Desert</option>
          <option value="city">City</option>
          <option value="farm">Farm</option>
          <option value="circuit">Grand Prix</option>
        </select>
      </label>

      <h2>Tool</h2>
      <div id="tools" class="tools">
        <button type="button" data-tool="road">Road</button>
        <button type="button" data-tool="hills">Hills</button>
        <button type="button" data-tool="river">River</button>
        <button type="button" data-tool="paint">Paint</button>
        <button type="button" data-tool="objects">Objects</button>
        <button type="button" data-tool="barriers">Barriers</button>
      </div>
      <div id="tool-options"></div>
      <p id="tool-help" class="help"></p>

      <h2>Check</h2>
      <ul id="problems"></ul>

      <div class="buttons">
        <button type="button" id="preview">3D view</button>
        <button type="button" id="save">Save</button>
        <button type="button" id="play" class="primary">Save &amp; race</button>
      </div>
      <div class="buttons">
        <button type="button" id="export">Export file</button>
        <label class="button">Import file<input id="import" type="file" accept="application/json,.json" hidden /></label>
      </div>
      <p class="help"><a href="/">← Back to the game</a></p>
    </aside>
    <main id="board">
      <canvas id="map"></canvas>
      <p id="status"></p>
    </main>
    <div id="preview-pane" hidden>
      <canvas id="preview-canvas"></canvas>
      <canvas id="preview-hud"></canvas>
      <button type="button" id="preview-close">Close 3D view</button>
    </div>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
