<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%225%22 width=%2210%22 height=%226%22 rx=%222%22 fill=%22%23f2c230%22/%3E%3C/svg%3E" />
    <title>Grass &amp; Grip — track editor</title>
  </head>
  <body class="editor">
    <aside id="panel">
      <h1>Track editor</h1>
      <label class="row">
        <span>My tracks</span>
        <select id="track-list"></select>
      </label>
      <div class="buttons">
        <button type="button" id="new">New</button>
        <button type="button" id="undo" title="Ctrl+Z">Undo</button>
        <button type="button" id="delete" class="danger">Delete</button>
      </div>

      <label class="row">
        <span>Name</span>
        <input id="name" maxlength="24" />
      </label>
      <label class="row">
        <span>Road width <b id="width-val"></b></span>
        <input id="width" type="range" min="50" max="95" step="1" />
      </label>
      <label class="row">
        <span>Map size</span>
        <select id="size">
          <option value="small">Small (1200 × 800)</option>
          <option value="medium">Medium (1600 × 1050)</option>
          <option value="large">Large (2200 × 1450)</option>
        </select>
      </label>
      <label class="row">
        <span>Ground</span>
        <select id="ground">
          <option value="grass">Grass</option>
          <option value="snow">Snow</option>
          <option value="sand">Sand</option>
          <option value="gravel">Gravel</option>
          <option value="dirt">Dirt</option>
          <option value="asphalt">Paving</option>
        </select>
      </label>
      <label class="row">
        <span>Road</span>
        <select id="road">
          <option value="asphalt">Asphalt</option>
          <option value="dirt">Dirt (rally stage)</option>
        </select>
      </label>
      <label class="row">
        <span>Theme</span>
        <select id="theme">
          <option value="">Automatic</option>
          <option value="meadow">Meadow</option>
          <option value="winter">Winter</option>
          <option value="jungle">Jungle</option>
          <option value="desert">Desert</option>
          <option value="city">City</option>
          <option value="farm">Farm</option>
          <option value="circuit">Grand Prix</option>
        </select>
      </label>

      <h2>Tool</h2>
      <div id="tools" class="tools">
        <button type="button" data-tool="road">Road</button>
        <button type="button" data-tool="hills">Hills</button>
        <button type="button" data-tool="river">River</button>
        <button type="button" data-tool="paint">Paint</button>
        <button type="button" data-tool="objects">Objects</button>
        <button type="button" data-tool="barriers">Barriers</button>
      </div>
      <div id="tool-options"></div>
      <p id="tool-help" class="help"></p>

      <h2>Check</h2>
      <ul id="problems"></ul>

      <div class="buttons">
        <button type="button" id="preview">3D view</button>
        <button type="button" id="save">Save</button>
        <button type="button" id="play" class="primary">Save &amp; race</button>
      </div>
      <div class="buttons">
        <button type="button" id="export">Export file</button>
        <label class="button">Import file<input id="import" type="file" accept="application/json,.json" hidden /></label>
      </div>
      <p class="help"><a href="/">← Back to the game</a></p>
    </aside>
    <main id="board">
      <canvas id="map"></canvas>
      <p id="status"></p>
    </main>
    <div id="preview-pane" hidden>
      <canvas id="preview-canvas"></canvas>
      <canvas id="preview-hud"></canvas>
      <button type="button" id="preview-close">Close 3D view</button>
    </div>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
